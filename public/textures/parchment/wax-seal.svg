<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="wax" cx="38%" cy="38%" r="62%">
      <stop offset="0%"  stop-color="#c84a36"/>
      <stop offset="55%" stop-color="#8b2c1c"/>
      <stop offset="100%" stop-color="#4a1208"/>
    </radialGradient>
    <filter id="wax-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1.2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Irregular wax blob (slight star to mimic drip) -->
  <path filter="url(#wax-shadow)"
        d="M32 4
           C42 6 52 10 56 20
           C60 30 58 42 50 50
           C42 58 30 60 20 56
           C8 52 4 40 6 28
           C8 14 22 2 32 4 Z"
        fill="url(#wax)"
        stroke="#3a0e06"
        stroke-width="1"/>
  <!-- Sigil: simple stylized rune (sword + crescent) -->
  <g stroke="#2a0a04" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="32" y1="18" x2="32" y2="44"/>
    <line x1="24" y1="26" x2="40" y2="26"/>
    <path d="M22 38 Q32 48 42 38" />
  </g>
</svg>
